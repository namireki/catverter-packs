name: Validate packs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pack repository
        uses: actions/checkout@v4
        with:
          # The publication delta check needs the PR base commit and its
          # published pack files; a shallow checkout is insufficient.
          fetch-depth: 0

      - name: Test publication compatibility rules
        run: python -m unittest discover -s scripts/tests -v

      - name: Check proposed publication against PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: >-
          python scripts/check_publication_compatibility.py
          --root "$GITHUB_WORKSPACE"
          --base-ref "$BASE_COMMIT"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test pack validator
        run: >-
          dotnet test
          tests/Catverter.PackValidator.Tests/Catverter.PackValidator.Tests.csproj
          --configuration Release

      - name: Validate pack repository
        run: >-
          dotnet run
          --project tools/Catverter.PackValidator/Catverter.PackValidator.csproj
          --configuration Release
          --no-restore
          -- validate-pack-repository "$GITHUB_WORKSPACE"
